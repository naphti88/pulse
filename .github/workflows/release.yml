# A tag "v…" builds Pulse for Apple silicon and Intel in one app, as a disk
# image and as a packed app, and for Windows, as an installer, and puts them on
# a draft release of that tag. Neither is signed with a developer certificate
# (see the README).
# Started by hand, it builds a tag that is already there.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and release, such as v0.2.0
        required: true

permissions:
  contents: write

# a tag push and a run by hand for the same tag wait for each other
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # the tag's release, found (a draft or not) or made as a draft before either
  # build, so the two builds upload to one release instead of each making one
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          id=${ids%%$'\n'*}
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="Pulse $TAG" \
              -f body="See the README for how to install the plugin and open the unsigned app." -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the toolchain pinned in rust-toolchain.toml, for both kinds of Mac
      - name: Rust
        working-directory: desktop/src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Packages
        working-directory: desktop
        run: npm run setup
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --target universal-apple-darwin --bundles app,dmg
          releaseId: ${{ needs.release.outputs.id }}
          tagName: ${{ inputs.tag || github.ref_name }}

  # the same tag for Windows: an installer (NSIS) on the same release
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Packages
        working-directory: desktop
        run: npm run setup
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --bundles nsis
          releaseId: ${{ needs.release.outputs.id }}
          tagName: ${{ inputs.tag || github.ref_name }}
